version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitman_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bitman}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitman}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bitman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitman_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bitman}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-32bytes-min-______}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_ROOT: /var/bitman/storage
    volumes:
      - storage:/var/bitman/storage
      - ../apps/api:/app
    ports:
      - "8000:8000"
    command: >
      bash -lc "alembic upgrade head &&
                uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bitman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitman_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bitman}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-32bytes-min-______}
      STORAGE_ROOT: /var/bitman/storage
    volumes:
      - storage:/var/bitman/storage
      - ../apps/api:/app
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  storage:
