[project]
name = "bitman-api"
version = "0.1.0"
description = "BITMAN FastAPI backend - Milwaukee 단가표 관리"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7.4",
  "itsdangerous>=2.2.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.7",
  "pdfplumber>=0.11.4",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "rapidfuzz>=3.9.6",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7",
  "mypy>=1.11.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
