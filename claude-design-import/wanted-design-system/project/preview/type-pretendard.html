<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Type — CJK + Latin</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card {
    padding: 36px 28px; gap: 14px;
    background: var(--color-neutral-50);
  }
  .specimen {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 56px; line-height: 1.18; letter-spacing: -0.024em;
    color: #000;
  }
  .meta {
    font-family: var(--font-mono); font-size: 10px; color: var(--alpha-61);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .latin { color: var(--color-blue-600); }
  .jp { color: var(--color-neutral-700); }
</style></head>
<body>
<div class="card">
  <div class="meta">Pretendard JP · trilingual rhythm</div>
  <div class="specimen">원티드 <span class="latin">Wanted</span> <span class="jp">プリテンダード</span></div>
</div>
</body></html>
