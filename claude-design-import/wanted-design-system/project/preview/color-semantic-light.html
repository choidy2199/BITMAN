<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Semantic — Light</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px; gap: 14px; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px;
  }
  .dot {
    width: 18px; height: 18px; border-radius: 6px;
    border: 1px solid var(--alpha-22);
  }
  .name { font-weight: 600; }
  .val { color: var(--alpha-61); font-family: var(--font-mono); font-size: 10px; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="row"><div class="dot" style="background:#fff"></div><div><div class="name">fill-base</div><div class="val">#FFFFFF</div></div></div>
    <div class="row"><div class="dot" style="background:var(--color-neutral-50)"></div><div><div class="name">fill-neutral-subtler</div><div class="val">#F7F7F8</div></div></div>
    <div class="row"><div class="dot" style="background:var(--alpha-08)"></div><div><div class="name">fill-neutral-subtle</div><div class="val">α 0.08</div></div></div>
    <div class="row"><div class="dot" style="background:var(--alpha-22)"></div><div><div class="name">stroke-neutral</div><div class="val">α 0.22</div></div></div>
    <div class="row"><div class="dot" style="background:var(--color-neutral-940)"></div><div><div class="name" style="color:var(--color-neutral-940)">text-neutral</div><div class="val">#171719</div></div></div>
    <div class="row"><div class="dot" style="background:var(--alpha-88)"></div><div><div class="name">text-neutral-subtle</div><div class="val">α 0.88</div></div></div>
    <div class="row"><div class="dot" style="background:var(--alpha-61)"></div><div><div class="name">text-neutral-subtler</div><div class="val">α 0.61</div></div></div>
    <div class="row"><div class="dot" style="background:var(--color-blue-600)"></div><div><div class="name" style="color:var(--color-blue-600)">text-primary / fill-primary</div><div class="val">#0066FF</div></div></div>
  </div>
</div>
</body></html>
