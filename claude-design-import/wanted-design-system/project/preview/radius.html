<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Radius scale</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box {
    width: 60px; height: 60px;
    background: var(--color-neutral-50);
    border: 1px solid var(--alpha-22);
  }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--alpha-61); }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="col"><div class="box" style="border-radius:4px"></div><div class="lbl">4</div></div>
    <div class="col"><div class="box" style="border-radius:8px"></div><div class="lbl">8</div></div>
    <div class="col"><div class="box" style="border-radius:12px"></div><div class="lbl">12</div></div>
    <div class="col"><div class="box" style="border-radius:16px"></div><div class="lbl">16</div></div>
    <div class="col"><div class="box" style="border-radius:24px"></div><div class="lbl">24</div></div>
    <div class="col"><div class="box" style="border-radius:32px"></div><div class="lbl">32</div></div>
    <div class="col"><div class="box" style="border-radius:60px"></div><div class="lbl">60</div></div>
    <div class="col"><div class="box" style="border-radius:9999px"></div><div class="lbl">pill</div></div>
  </div>
</div>
</body></html>
