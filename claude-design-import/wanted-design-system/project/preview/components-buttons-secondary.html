<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Buttons — Secondary & Tertiary</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px; gap: 16px; }
  .row { display:flex; align-items:center; gap: 12px; flex-wrap: wrap; }
  .btn {
    border: 0; cursor: pointer; height: 48px; padding: 0 20px; border-radius: 10px;
    font-family: var(--font-sans); font-weight: 600; font-size: 15px;
    transition: background 120ms cubic-bezier(0.16,1,0.3,1);
    display: inline-flex; align-items:center; gap: 6px;
  }
  .btn-secondary { background: var(--alpha-08); color: var(--color-text-neutral); }
  .btn-secondary.hover { background: var(--alpha-22); }
  .btn-tertiary  { background: transparent; color: var(--color-text-neutral); border: 1px solid var(--alpha-22); }
  .btn-tertiary.hover  { background: var(--alpha-08); }
  .btn-ghost { background: transparent; color: var(--color-text-neutral); }
  .btn-ghost.hover { background: var(--alpha-08); }
  .btn-danger { background: var(--color-red-600); color: #fff; }
  .btn-danger.hover { background: var(--color-red-700); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--alpha-61); width: 80px; }
</style></head>
<body>
<div class="card">
  <div class="row"><div class="lbl">Secondary</div>
    <button class="btn btn-secondary">저장하기</button>
    <button class="btn btn-secondary hover">저장하기</button>
  </div>
  <div class="row"><div class="lbl">Tertiary</div>
    <button class="btn btn-tertiary">공유</button>
    <button class="btn btn-tertiary hover">공유</button>
  </div>
  <div class="row"><div class="lbl">Ghost</div>
    <button class="btn btn-ghost">취소</button>
    <button class="btn btn-ghost hover">취소</button>
  </div>
  <div class="row"><div class="lbl">Danger</div>
    <button class="btn btn-danger">삭제하기</button>
    <button class="btn btn-danger hover">삭제하기</button>
  </div>
</div>
</body></html>
