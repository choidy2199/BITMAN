<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Spacing tokens</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; height: 24px; }
  .row .num {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--alpha-61); width: 56px; text-align: right;
  }
  .bar { background: var(--color-blue-600); height: 16px; border-radius: 4px; }
  .name { font-size: 12px; font-weight: 600; color: var(--color-text-neutral); }
</style></head>
<body>
<div class="card">
  <div class="row"><div class="num">4</div><div class="bar" style="width:4px"></div><div class="name">space-4</div></div>
  <div class="row"><div class="num">8</div><div class="bar" style="width:8px"></div><div class="name">space-8</div></div>
  <div class="row"><div class="num">12</div><div class="bar" style="width:12px"></div><div class="name">space-12</div></div>
  <div class="row"><div class="num">16</div><div class="bar" style="width:16px"></div><div class="name">space-16</div></div>
  <div class="row"><div class="num">24</div><div class="bar" style="width:24px"></div><div class="name">space-24</div></div>
  <div class="row"><div class="num">32</div><div class="bar" style="width:32px"></div><div class="name">space-32</div></div>
  <div class="row"><div class="num">48</div><div class="bar" style="width:48px"></div><div class="name">space-48</div></div>
  <div class="row"><div class="num">64</div><div class="bar" style="width:64px"></div><div class="name">space-64</div></div>
  <div class="row"><div class="num">96</div><div class="bar" style="width:96px"></div><div class="name">space-96</div></div>
  <div class="row"><div class="num">128</div><div class="bar" style="width:128px"></div><div class="name">space-128</div></div>
</div>
</body></html>
