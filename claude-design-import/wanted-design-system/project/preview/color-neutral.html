<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Neutral Scale</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px; gap: 12px; }
  .title { font-weight: 700; font-size: 16px; letter-spacing: -0.012em; }
  .sub { font-size: 12px; color: var(--alpha-61); }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .stop { aspect-ratio: 1; border-radius: 6px; }
  .stop.first { box-shadow: inset 0 0 0 1px rgba(112,115,124,0.16); }
  .row2 { display:grid; grid-template-columns: repeat(11, 1fr); gap:4px; margin-top:6px; }
  .row2 span { font-family: var(--font-mono); font-size:9px; text-align:center; color: var(--alpha-61); }
</style></head>
<body>
<div class="card">
  <div>
    <div class="title">Neutral · warm-cool blue-gray</div>
    <div class="sub">21 stops. Body text rides on 940 (#171719); UI surfaces on 50 (#F7F7F8); strokes on 22% alpha.</div>
  </div>
  <div class="grid" id="ramp"></div>
  <div class="row2" id="labels"></div>
</div>
<script>
  const stops = ['50','100','200','250','400','500','600','700','800','870','900','940','980'];
  const display = ['50','100','200','250','400','500','600','700','800','900','940'];
  const ramp = document.getElementById('ramp');
  const labels = document.getElementById('labels');
  const cs = getComputedStyle(document.documentElement);
  display.forEach((s,i)=>{
    const v = cs.getPropertyValue(`--color-neutral-${s}`).trim();
    const d = document.createElement('div');
    d.className = 'stop' + (i===0 ? ' first' : '');
    d.style.background = v;
    ramp.appendChild(d);
    const l = document.createElement('span'); l.textContent = s; labels.appendChild(l);
  });
</script>
</body></html>
