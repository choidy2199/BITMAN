<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Type — Display & Title</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .row .meta {
    font-family: var(--font-mono); font-size: 10px; color: var(--alpha-61);
    width: 90px; flex-shrink: 0;
  }
  .row .specimen { color: #000; }
  .display2  { font-size: 40px; line-height: 52px; letter-spacing: -0.0282em; font-weight: 700; }
  .display3  { font-size: 36px; line-height: 48px; letter-spacing: -0.027em;  font-weight: 700; }
  .title1    { font-size: 32px; line-height: 44px; letter-spacing: -0.0253em; font-weight: 700; }
  .title2    { font-size: 28px; line-height: 38px; letter-spacing: -0.0236em; font-weight: 700; }
  .title3    { font-size: 24px; line-height: 32px; letter-spacing: -0.023em;  font-weight: 700; }
</style></head>
<body>
<div class="card">
  <div class="row"><div class="meta">Display 2 · 40</div><div class="specimen display2">원티드 Wanted</div></div>
  <div class="row"><div class="meta">Display 3 · 36</div><div class="specimen display3">원티드 Wanted</div></div>
  <div class="row"><div class="meta">Title 1 · 32</div><div class="specimen title1">원티드 Wanted</div></div>
  <div class="row"><div class="meta">Title 2 · 28</div><div class="specimen title2">원티드 Wanted</div></div>
  <div class="row"><div class="meta">Title 3 · 24</div><div class="specimen title3">원티드 Wanted</div></div>
</div>
</body></html>
