<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Cards</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { background: var(--color-neutral-50); }
  .card { padding: 28px; gap: 14px; background: var(--color-neutral-50); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .ds-card {
    background: #fff;
    border: 1px solid var(--alpha-22);
    border-radius: 24px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ds-card .role { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-blue-600); font-weight: 700; }
  .ds-card h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.012em; line-height: 1.32; }
  .ds-card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--color-text-neutral-subtle); }

  .feature {
    background: var(--alpha-08);
    border-radius: 32px; padding: 28px;
  }
  .feature h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.0194em; }
  .feature p { margin: 0; font-size: 13px; color: var(--color-text-neutral-subtle); }
  .footer-row { display:flex; align-items:center; justify-content:space-between; margin-top: 4px; }
  .meta { font-size: 12px; color: var(--alpha-61); }
  .pill { background: var(--color-blue-600); color: #fff; height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="ds-card">
      <div class="role">Wanted</div>
      <h3>제품팀과 함께 일할 디자이너</h3>
      <p>프로덕트 디자인 · 서울 · 3년 이상</p>
      <div class="footer-row"><span class="meta">D-3 · 합격률 31%</span><span class="pill">지원</span></div>
    </div>
    <div class="feature">
      <div class="role" style="color:var(--color-blue-700);">Theme card</div>
      <h3>큰 페이지 섹션을 위한 카드</h3>
      <p>border-radius 32, 0.08 alpha fill, padded 28+. 그림자 없음.</p>
    </div>
  </div>
</div>
</body></html>
