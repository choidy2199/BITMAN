<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Status Colors</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .swatch {
    display: flex; flex-direction: column; gap: 8px;
  }
  .chip {
    height: 64px; border-radius: 12px; display: flex; align-items: flex-end; padding: 10px 12px;
    color: #fff; font-weight: 700; font-size: 13px; letter-spacing: -0.012em;
  }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .meta .name { font-size: 13px; font-weight: 600; }
  .meta .hex { font-family: var(--font-mono); font-size: 11px; color: var(--alpha-61); }
  .subtle { display: flex; gap: 6px; }
  .subtle div { flex: 1; height: 22px; border-radius: 6px; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="chip" style="background:var(--color-green-600)">Positive</div>
      <div class="meta"><div class="name">Green 600</div><div class="hex">#00BF40</div></div>
      <div class="subtle">
        <div style="background:var(--color-green-100)"></div>
        <div style="background:var(--color-green-700)"></div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--color-orange-600)">Warning</div>
      <div class="meta"><div class="name">Orange 600</div><div class="hex">#FF9200</div></div>
      <div class="subtle">
        <div style="background:var(--color-orange-100)"></div>
        <div style="background:var(--color-orange-700)"></div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--color-red-600)">Danger</div>
      <div class="meta"><div class="name">Red 600</div><div class="hex">#FF4242</div></div>
      <div class="subtle">
        <div style="background:var(--color-red-100)"></div>
        <div style="background:var(--color-red-700)"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
