<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Elevation</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { background: var(--color-neutral-50); }
  .card { padding: 28px 24px; gap: 18px; background: var(--color-neutral-50); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .surface {
    width: 96px; height: 96px;
    background: #fff;
    border-radius: 12px;
  }
  .e1 { box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .e2 { box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 12px rgba(23,23,23,0.07); }
  .e3 { box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 12px rgba(23,23,23,0.07), 0 12px 32px rgba(23,23,23,0.06); }
  .e4 { box-shadow: 0 24px 64px rgba(23,23,23,0.10), 0 4px 12px rgba(23,23,23,0.06); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--alpha-61); }
  .name { font-size: 12px; font-weight: 600; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="col"><div class="surface e1"></div><div class="name">shadow-1</div><div class="lbl">tooltip</div></div>
    <div class="col"><div class="surface e2"></div><div class="name">shadow-2</div><div class="lbl">popover</div></div>
    <div class="col"><div class="surface e3"></div><div class="name">shadow-3</div><div class="lbl">menu</div></div>
    <div class="col"><div class="surface e4"></div><div class="name">shadow-modal</div><div class="lbl">dialog</div></div>
  </div>
</div>
</body></html>
