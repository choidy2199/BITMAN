<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wanted UI kit · Job marketplace</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/wanted-symbol.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tab, setTab] = useState("home");
  const [open, setOpen] = useState(null);
  const [saved, setSaved] = useState(new Set());
  const [applied, setApplied] = useState(new Set());
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState(null);

  function toggleSave(job) {
    setSaved((s) => {
      const next = new Set(s);
      next.has(job.id) ? next.delete(job.id) : next.add(job.id);
      return next;
    });
  }
  function applyTo(job) {
    setApplied((a) => new Set(a).add(job.id));
    setOpen(null);
    setToast(`${job.company} · ${job.title} 지원이 완료됐어요`);
    setTimeout(() => setToast(null), 2400);
  }

  return (
    <div data-screen-label="Wanted Home">
      <Header tab={tab} onTab={setTab} onProfile={() => setDrawer(true)} applied={applied.size} />
      <HomeFeed saved={saved} onSave={toggleSave} onOpen={setOpen} />
      <JobDetail job={open} onClose={() => setOpen(null)} onApply={applyTo} applied={applied} saved={saved} onSave={toggleSave} />
      <AppliedDrawer open={drawer} onClose={() => setDrawer(false)} applied={applied} />
      {toast && <div className="wnt-toast"><span className="acc">✓</span> {toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
